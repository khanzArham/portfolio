name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR or branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci:
    # Required status check on main (branch protection).
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Content validation
        run: npm run validate:content

      - name: Unit tests
        run: npm test

      # Builds the "_" fixture dossiers so E2E can test them. Vercel never
      # sets this, so fixtures stay off the live site.
      - name: Build
        run: npm run build
        env:
          CONTENT_FIXTURES: 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts the production server from the build above.
      - name: E2E tests
        run: npm run test:e2e
        env:
          # The contact form validates and rate-limits but never sends.
          CONTACT_DRY_RUN: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
